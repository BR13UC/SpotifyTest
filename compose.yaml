services:
  statify:
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - statify_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
  musicbrainz-worker:
    build: .
    env_file: .env
    command: ["python", "-m", "app.services.musicbrainz_worker"]
    restart: unless-stopped
    volumes:
      - statify_data:/data

  ia-worker:
    build: .
    env_file: .env
    command: ["python", "-m", "app.services.ia_worker"]
    restart: unless-stopped
    volumes:
      - statify_data:/data

volumes:
  statify_data:
